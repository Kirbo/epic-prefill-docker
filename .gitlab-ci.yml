stages:
  - build

# The Mac Docker runner by trust (docs: ~/Documents/Claude/GitLab/BuildKit.md on the Mac Mini):
# pipelines of a protected branch — `master`, the daily schedule included — run on the ref-protected
# "Kirbo Mini Protected" runner (its own cache, protected-branch jobs only); every other pipeline on
# the shared "Kirbo Mini". Jobs name `$MAC_DOCKER`, never the tag itself.
variables:
  MAC_DOCKER: "macos"

workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      variables: { MAC_DOCKER: macos-protected }
    - when: always

default:
  tags:
    - $MAC_DOCKER

# Builds and pushes the multi-arch image when upstream has a newer release (build-and-push.sh exits
# early otherwise). Protected branches only: the registry token is a protected variable, so a
# branch pipeline could not push anyway.
#
# No Docker socket: `docker buildx` talks to the Mac's protected BuildKit server over mutual TLS
# (`--driver remote`; the client certificate is in the protected File variables BUILDKIT_PROTECTED_*).
# `docker login` needs no daemon: it only writes the job's ~/.docker/config.json, which buildx hands
# to BuildKit for the push.
build and push docker image:
  stage: build
  # docker:29.9.2-cli (buildx 0.38.1), pinned by digest.
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  variables:
    BUILDER_NAME: "ci-$CI_JOB_ID"
  before_script:
    - apk add --no-cache bash curl jq
    - docker buildx create --name "$BUILDER_NAME" --driver remote --driver-opt "cacert=$BUILDKIT_PROTECTED_CA,cert=$BUILDKIT_PROTECTED_CERT,key=$BUILDKIT_PROTECTED_KEY" tcp://host.docker.internal:12340 --use
    - docker buildx inspect --bootstrap "$BUILDER_NAME"
  script:
    - echo -n "$CI_REGISTRY_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - ./build-and-push.sh
  after_script:
    - docker buildx rm "$BUILDER_NAME" || true
    - docker logout "$CI_REGISTRY" || true
